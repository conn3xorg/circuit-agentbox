name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      # The example reads the public key up.sh makes.
      - name: Validate the example
        working-directory: examples/local
        run: |
          ssh-keygen -q -t ed25519 -N '' -f id_ed25519
          conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Logs in as dev with the example's key, in a login shell as tmux and
      # an SSH client would start, and uses what the circuit installed.
      - name: Check the dev user has the tools, the npm packages and the clone
        working-directory: examples/local
        run: |
          ssh -p 2290 -i id_ed25519 -o UserKnownHostsFile=known_hosts -o IdentitiesOnly=yes dev@127.0.0.1 bash -l <<'EOF'
          set -eux
          git --version
          node --version | grep '^v26\.'
          tmux -V
          rg --version
          jq --version
          cc --version
          [ "$(command -v cowsay)" = "$HOME/.local/bin/cowsay" ]
          cowsay moo
          semver 1.2.3
          [ "$(git config --global user.email)" = dev@example.com ]
          git -C ~/code/Hello-World log --oneline -1
          [ "$(stat -c %U ~/code/Hello-World)" = dev ]
          EOF
      # No password means the account can only log in with a key.
      - name: Check the dev user has no password
        run: |
          sudo podman exec circuit-agentbox getent shadow dev | cut -d: -f2 | grep -qE '^!+$'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

